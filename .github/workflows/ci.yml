name: CI
on:
  push:
    branches: [v1, main, slice-2-channels, slice-3-tasks, slice-4-agent, slice-5-approvals]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://tandem:tandem-ci-only@localhost:5432/tandem
      JWT_SECRET: tandem-ci-only-signing-key-at-least-32-characters
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      MAIL_MODE: outbox
      AGENT_FAKE_PROVIDER: 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem-ci-only
          POSTGRES_DB: tandem
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U tandem -d tandem" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node.js 24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, Node.js 24
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0, Node.js 24
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        run: uv sync --project backend --frozen
      - name: Backend lint and integration tests
        working-directory: backend
        run: |
          uv run --frozen ruff check app migrations tests
          uv run --frozen ruff format --check app migrations tests
          uv run --frozen ruff check --config pyproject.toml ../infra/check_approval_live.py ../infra/check_agent_models.py ../infra/check_agent_providers.py ../infra/run_eval.py ../infra/memory_backfill.py ../infra/check_memory_live.py
          uv run --frozen ruff format --check --config pyproject.toml ../infra/check_approval_live.py ../infra/check_agent_models.py ../infra/check_agent_providers.py ../infra/run_eval.py ../infra/memory_backfill.py ../infra/check_memory_live.py
          uv run --frozen pytest -q
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check shared live event contract
        run: backend/.venv/bin/python infra/export_events.py --check
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          # A long-lived uv run holds the cache lock and blocks setup-uv's post-job pruning.
          AUTH_RATE_LIMIT=100 .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log --ws-max-size 8192 --ws-ping-interval 15 --ws-ping-timeout 20 > "$RUNNER_TEMP/tandem-backend.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/tandem-backend.pid"
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://localhost:8000/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Backend did not become healthy')
          PY
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Stop backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tandem-backend.pid" ]; then
            read -r tandem_backend_pid < "$RUNNER_TEMP/tandem-backend.pid"
            if kill -0 "$tandem_backend_pid" 2>/dev/null; then
              kill "$tandem_backend_pid"
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
