name: tandem
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 infra/bootstrap.py first}
      POSTGRES_DB: tandem
    ports:
      - "127.0.0.1:${TANDEM_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://tandem:${POSTGRES_PASSWORD}@db:5432/tandem
      JWT_SECRET: ${JWT_SECRET:?Run python3 infra/bootstrap.py first}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ATTACHMENT_DIR: /app/.local/attachments
      MESSAGE_REQUESTS_PER_MINUTE: ${MESSAGE_REQUESTS_PER_MINUTE:-60}
      WS_CONNECTIONS_PER_USER: ${WS_CONNECTIONS_PER_USER:-5}
      WS_CONNECTIONS_PER_IP: ${WS_CONNECTIONS_PER_IP:-30}
      WS_FRAMES_PER_MINUTE: ${WS_FRAMES_PER_MINUTE:-120}
      WS_IDLE_SECONDS: ${WS_IDLE_SECONDS:-60}
      MAIL_MODE: ${MAIL_MODE:-outbox}
      MAIL_OUTBOX: /app/.local/mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Tandem <no-reply@localhost>}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TANDEM_OPENAI_API_KEY: ${TANDEM_OPENAI_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AGENT_FAKE_PROVIDER: ${AGENT_FAKE_PROVIDER:-false}
      AGENT_WORKER_ENABLED: ${AGENT_WORKER_ENABLED:-true}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-60}
      AGENT_WORKSPACE_CONCURRENCY: ${AGENT_WORKSPACE_CONCURRENCY:-1}
      AGENT_WORKER_SLOTS: ${AGENT_WORKER_SLOTS:-4}
      AGENT_USER_RUNS_PER_MINUTE: ${AGENT_USER_RUNS_PER_MINUTE:-5}
      AGENT_WORKSPACE_RUNS_PER_MINUTE: ${AGENT_WORKSPACE_RUNS_PER_MINUTE:-20}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-groq}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-10}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-512}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-5}
    ports:
      - "127.0.0.1:${TANDEM_API_PORT:-8000}:8000"
    volumes:
      - mail_outbox:/app/.local
      - image_attachments:/app/.local/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  mail_outbox:
  image_attachments:
